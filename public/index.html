<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de Personas</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --muted: #6b7385;
      --primary: #4f46e5; --primary-hover: #4338ca; --border: #e2e6ef;
      --ok: #15803d; --err: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 32px 16px;
    }
    .wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 24px; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    p.sub { margin: 0; color: var(--muted); }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 24px; box-shadow: 0 4px 16px rgba(20, 30, 60, .05);
    }
    form { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
    .full { grid-column: 1 / -1; }
    label { display: grid; gap: 6px; font-size: .9rem; font-weight: 600; }
    input {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 1rem; font-family: inherit;
    }
    input:focus { outline: 2px solid var(--primary); border-color: transparent; }
    button {
      background: var(--primary); color: #fff; border: 0; border-radius: 8px;
      padding: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: .6; cursor: wait; }
    #msg { min-height: 1.2em; margin: 0; font-size: .95rem; }
    #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: .95rem; }
    th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
    td.email { word-break: break-all; }
    .del { background: transparent; color: var(--err); padding: 4px 8px; font-size: .85rem; }
    .del:hover { background: #fee2e2; }
    .empty { color: var(--muted); text-align: center; padding: 16px; }
    @media (max-width: 560px) {
      form { grid-template-columns: 1fr; }
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Registro de Personas</h1>
      <p class="sub">Completá el formulario para registrar una persona.</p>
    </header>

    <section class="card">
      <form id="form">
        <label>Nombre
          <input name="nombre" required maxlength="100" autocomplete="given-name" />
        </label>
        <label>Apellido
          <input name="apellido" required maxlength="100" autocomplete="family-name" />
        </label>
        <label class="full">Email
          <input name="email" type="email" required maxlength="255" autocomplete="email" />
        </label>
        <button class="full" type="submit">Registrar</button>
        <p id="msg" class="full" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Personas registradas (<span id="count">0</span>)</h2>
      <table>
        <thead><tr><th>Nombre</th><th>Apellido</th><th>Email</th><th>Fecha</th><th></th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </section>
  </div>

  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const lista = document.getElementById("lista");
    const count = document.getElementById("count");

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function cargar() {
      const res = await fetch("/api/personas");
      const personas = await res.json();
      count.textContent = personas.length;
      lista.innerHTML = personas.length
        ? personas.map(p => `
            <tr>
              <td>${esc(p.nombre)}</td>
              <td>${esc(p.apellido)}</td>
              <td class="email">${esc(p.email)}</td>
              <td>${new Date(p.creado_en).toLocaleDateString("es")}</td>
              <td><button class="del" data-id="${p.id}" title="Eliminar">✕</button></td>
            </tr>`).join("")
        : `<tr><td colspan="5" class="empty">Todavía no hay personas registradas.</td></tr>`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = form.querySelector("button[type=submit]");
      btn.disabled = true;
      msg.className = ""; msg.textContent = "";
      try {
        const data = Object.fromEntries(new FormData(form));
        const res = await fetch("/api/personas", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || "Error");
        msg.className = "ok";
        msg.textContent = `✔ ${body.nombre} ${body.apellido} registrado correctamente`;
        form.reset();
        cargar();
      } catch (err) {
        msg.className = "err";
        msg.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });

    lista.addEventListener("click", async (e) => {
      const id = e.target.dataset.id;
      if (!id || !confirm("¿Eliminar esta persona?")) return;
      await fetch(`/api/personas/${id}`, { method: "DELETE" });
      cargar();
    });

    cargar();
  </script>
</body>
</html>
